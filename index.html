<!doctype html>
<html><head><meta charset="utf-8"><title>Tarang — Air Harp</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;height:100%;background:#000;color:#ddd;font:14px system-ui;overflow:hidden}
#stage{position:relative;width:100vw;height:100vh}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;transform:scaleX(-1)}
video{opacity:.5}
#ui{position:fixed;left:12px;top:10px;z-index:5;line-height:1.6;text-shadow:0 0 4px #000;font-size:13px}
#note{position:fixed;right:16px;top:12px;z-index:5;font-size:30px;font-weight:bold;opacity:0;transition:opacity 0.15s;pointer-events:none}
#note.show{opacity:1}
#go{position:fixed;inset:0;margin:auto;width:200px;height:56px;z-index:6;font-size:18px;border-radius:12px;border:0;background:#7cf;cursor:pointer}
</style></head>
<body>
<div id="stage"><video id="v" playsinline muted></video><canvas id="c"></canvas></div>
<div id="ui">
  Pinch one hand → drag → release = string<br>
  OR both hands pinch → string between them<br>
  Swipe finger across string → pluck<br>
  Z undo · C clear
</div>
<div id="note"></div>
<button id="go">Start Air Harp</button>

<script type="module">
/*
 *  Tarang — Air Harp
 *
 *  Built from the working prototype with these fixes:
 *  1. Audio nodes are properly stopped + disconnected (prevents freeze)
 *  2. Concurrent audio capped at 8
 *  3. Both one-hand AND two-hand string drawing
 *  4. Grab an endpoint to resize
 *  5. Entire frame loop wrapped in try-catch (never dies)
 *  6. No heavy canvas effects (no shadowBlur, no extra canvases)
 */

import {HandLandmarker, FilesetResolver} from
  "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

const $ = id => document.getElementById(id);
const video = $('v'), cv = $('c'), ctx = cv.getContext('2d');
const noteEl = $('note');

let W = 1280, H = 720, ac, hl, lastT = -1;
let strings = [], sparks = [];

// Per-hand state: tracks pinch status, landmarks, etc.
const handState = {};
const prevTips = {};

// Audio tracking
let liveNodes = 0;
const MAX_NODES = 8;
const noteCache = {};

// Grab state
let grab = null;  // { idx, ep:'a'|'b', hand }

// Constants
const PENT = [0, 2, 4, 7, 9];
const CONN = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],[0,17]];
const PLUCK_CD = 150;
const GRAB_R = 50;

const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });

const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
function midiName(m) { return noteNames[m % 12] + (Math.floor(m / 12) - 1); }


// ══════════════════════════════════════════════════════════
//  AUDIO — Karplus-Strong, properly managed
// ══════════════════════════════════════════════════════════

function ksGen(midi) {
  if (noteCache[midi]) return noteCache[midi];
  const sr = ac.sampleRate, f = 440 * 2 ** ((midi - 69) / 12);
  const N = Math.max(2, Math.round(sr / f)), len = sr * 2;
  const buf = ac.createBuffer(1, len, sr), d = buf.getChannelData(0);
  const ring = Float32Array.from({length: N}, () => Math.random() * 2 - 1);
  // warm the attack
  for (let i = 1; i < N; i++) ring[i] = 0.5 * ring[i] + 0.5 * ring[i-1];
  let p = 0;
  for (let i = 0; i < len; i++) {
    const n = (p + 1) % N;
    d[i] = ring[p];
    ring[p] = (ring[p] + ring[n]) * 0.498;
    p = n;
  }
  return noteCache[midi] = buf;
}

function playNote(midi, vel) {
  if (!ac || liveNodes >= MAX_NODES) return;
  const now = ac.currentTime;
  const src = ac.createBufferSource();
  const g = ac.createGain();
  src.buffer = ksGen(midi);
  g.gain.setValueAtTime(vel * 0.55, now);
  g.gain.linearRampToValueAtTime(0, now + 2);
  src.connect(g).connect(ac.destination);
  liveNodes++;
  src.onended = () => {
    liveNodes--;
    try { src.disconnect(); g.disconnect(); } catch(_) {}
  };
  src.start();
  src.stop(now + 2);  // ← THIS is the freeze fix. Original never stopped nodes.
}


// ══════════════════════════════════════════════════════════
//  PITCH & GEOMETRY
// ══════════════════════════════════════════════════════════

function noteFor(L) {
  let semis = Math.min(36, Math.max(0, 12 * Math.log2(W * 0.8 / Math.max(L, 10))));
  const oct = Math.floor(semis / 12), r = semis - oct * 12;
  let deg = PENT.concat(12).reduce((a, b) => Math.abs(b - r) < Math.abs(a - r) ? b : a);
  return 48 + oct * 12 + deg;
}

function segInt(p1, p2, p3, p4) {
  const d = (p2.x-p1.x)*(p4.y-p3.y) - (p2.y-p1.y)*(p4.x-p3.x);
  if (!d) return null;
  const t = ((p3.x-p1.x)*(p4.y-p3.y) - (p3.y-p1.y)*(p4.x-p3.x)) / d;
  const u = ((p3.x-p1.x)*(p2.y-p1.y) - (p3.y-p1.y)*(p2.x-p1.x)) / d;
  return t>=0&&t<=1&&u>=0&&u<=1 ? {x:p1.x+t*(p2.x-p1.x), y:p1.y+t*(p2.y-p1.y)} : null;
}

function mkString(a, b) {
  const L = dist(a, b);
  if (L < 50) return null;
  const midi = noteFor(L);
  const s = { a:{...a}, b:{...b}, L, midi, hue: (midi-48)*8%360, vib: 0, last: 0 };
  strings.push(s);
  return s;
}

function refreshString(s) {
  s.L = dist(s.a, s.b);
  s.midi = noteFor(s.L);
  s.hue = (s.midi - 48) * 8 % 360;
}

function showNote(name, hue) {
  noteEl.textContent = name;
  noteEl.style.color = `hsl(${hue},100%,80%)`;
  noteEl.style.textShadow = `0 0 12px hsl(${hue},100%,60%)`;
  noteEl.classList.add('show');
  clearTimeout(noteEl._t);
  noteEl._t = setTimeout(() => noteEl.classList.remove('show'), 900);
}

function spark(pt, n, hue) {
  for (let i = 0; i < n; i++) {
    const an = Math.random() * 6.28, sp = 2 + Math.random() * 7;
    sparks.push({x:pt.x, y:pt.y, vx:Math.cos(an)*sp, vy:Math.sin(an)*sp-2, life:1, hue});
  }
}


// ══════════════════════════════════════════════════════════
//  GESTURE HANDLING
// ══════════════════════════════════════════════════════════

function handle(landmarks) {
  const now = performance.now();

  // Clean up disappeared hands
  for (const k of Object.keys(handState)) {
    if (+k >= landmarks.length) { delete handState[k]; delete prevTips[k]; }
  }

  // Process each hand individually (pinch state, tips)
  const hands = [];
  for (let i = 0; i < landmarks.length; i++) {
    const l = landmarks[i];
    const P = j => ({ x: l[j].x * W, y: l[j].y * H });
    const thumb = P(4), index = P(8);
    const scale = dist(P(0), P(9));
    const m = mid(thumb, index);
    const d = dist(thumb, index);

    let st = handState[i];
    if (!st) st = handState[i] = { pin: false, start: null, cur: null };
    st.l = l;

    // Hysteresis pinch detection
    const pinch = st.pin ? d < scale * 0.5 : d < scale * 0.3;

    if (pinch && !st.pin) st.start = { ...m };   // pinch just started
    if (pinch) st.cur = { ...m };                 // update position while pinching

    hands.push({ i, l, pinch, wasPinch: st.pin, mid: m, start: st.start, cur: st.cur, tips: [P(8), P(12)] });

    st.pin = pinch;
  }

  // ── TWO-HAND DRAWING: if both hands are pinching ──────
  const pinching = hands.filter(h => h.pinch);
  const justReleased = hands.filter(h => !h.pinch && h.wasPinch);

  if (pinching.length >= 2) {
    // Both hands pinching — check for grab first, else draw between them

    if (!grab) {
      // Try to grab an existing endpoint
      let found = false;
      for (let si = 0; si < strings.length && !found; si++) {
        const s = strings[si];
        for (const ph of pinching) {
          if (dist(ph.mid, s.a) < GRAB_R) { grab = { idx: si, ep: 'a', hand: ph.i }; found = true; break; }
          if (dist(ph.mid, s.b) < GRAB_R) { grab = { idx: si, ep: 'b', hand: ph.i }; found = true; break; }
        }
      }
    }

    if (grab && strings[grab.idx]) {
      // Move the grabbed endpoint
      const gh = hands.find(h => h.i === grab.hand);
      if (gh && gh.pinch) {
        strings[grab.idx][grab.ep] = { ...gh.mid };
        refreshString(strings[grab.idx]);
      }
    }
  }

  // ── STRING CREATION on release ────────────────────────
  if (justReleased.length > 0) {
    if (grab) {
      // Was grabbing — just release the grab
      grab = null;
    } else if (pinching.length >= 1 && justReleased.length >= 1) {
      // Two-hand: one released while other still pinching (or both released same frame)
      // Create string between the two hand positions
      const a = justReleased[0];
      const b = pinching[0] || (justReleased.length > 1 ? justReleased[1] : null);
      if (a && b && a.start && b.cur) {
        const s = mkString(a.cur || a.start, b.cur);
        if (s) playNote(s.midi, 0.1);
      }
    } else if (justReleased.length >= 2) {
      // Both released same frame
      const a = justReleased[0], b = justReleased[1];
      if (a.cur && b.cur) {
        const s = mkString(a.cur, b.cur);
        if (s) playNote(s.midi, 0.1);
      }
    } else if (justReleased.length === 1 && pinching.length === 0) {
      // ONE-HAND drawing (original behavior): pinch-drag-release on single hand
      const h = justReleased[0];
      if (h.start && h.cur && dist(h.start, h.cur) > 60) {
        const s = mkString(h.start, h.cur);
        if (s) playNote(s.midi, 0.1);
      }
      grab = null;
    }
  }

  // If no hands are pinching, clear grab
  if (pinching.length === 0) grab = null;

  // ── PLUCK DETECTION ───────────────────────────────────
  for (const h of hands) {
    if (h.pinch) { prevTips[h.i] = null; continue; }

    const prev = prevTips[h.i];
    if (prev) {
      for (let k = 0; k < h.tips.length; k++) {
        if (!prev[k]) continue;
        for (const s of strings) {
          if (now - s.last < PLUCK_CD) continue;
          const hit = segInt(prev[k], h.tips[k], s.a, s.b);
          if (hit) {
            const vel = Math.min(1, Math.max(0.2, dist(prev[k], h.tips[k]) / 40));
            s.last = now;
            s.vib = vel;
            playNote(s.midi, vel);
            spark(hit, Math.round(10 + vel * 25), s.hue);
            showNote(midiName(s.midi), s.hue);
          }
        }
      }
    }
    prevTips[h.i] = h.tips;
  }
}


// ══════════════════════════════════════════════════════════
//  DRAWING — clean, lightweight, no shadowBlur
// ══════════════════════════════════════════════════════════

function draw() {
  const now = performance.now();
  ctx.clearRect(0, 0, W, H);

  // ── Strings ──────────────────────────────────────────
  for (const s of strings) {
    s.vib *= 0.94;
    if (s.vib < 0.01) s.vib = 0;

    const dx = s.b.x-s.a.x, dy = s.b.y-s.a.y, L = s.L||1;
    const nx = -dy/L, ny = dx/L;
    const v = s.vib;

    // Build path points
    const pts = [];
    for (let i = 0; i <= 36; i++) {
      const t = i / 36;
      const off = Math.sin(Math.PI * t) * v * 26 * Math.sin(now * 0.06 + t * 9);
      pts.push({ x: s.a.x + dx*t + nx*off, y: s.a.y + dy*t + ny*off });
    }

    function strokePts(color, w) {
      ctx.strokeStyle = color; ctx.lineWidth = w;
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++) i ? ctx.lineTo(pts[i].x, pts[i].y) : ctx.moveTo(pts[i].x, pts[i].y);
      ctx.stroke();
    }

    ctx.save();
    ctx.lineCap = 'round';

    // Outer glow (thick + transparent + lighter)
    ctx.globalCompositeOperation = 'lighter';
    strokePts(`hsla(${s.hue},100%,50%,${0.05 + v*0.1})`, 10 + v*8);

    // Mid glow
    strokePts(`hsla(${s.hue},100%,55%,${0.12 + v*0.2})`, 4 + v*4);

    // Core
    ctx.globalCompositeOperation = 'source-over';
    strokePts(`hsl(${s.hue},100%,${75+v*20}%)`, 1.5 + v*2.5);

    // White-hot when vibrating
    if (v > 0.1) {
      ctx.globalCompositeOperation = 'lighter';
      strokePts(`rgba(255,255,255,${v*0.3})`, 0.8 + v);
    }

    ctx.restore();

    // Endpoints
    for (const p of [s.a, s.b]) {
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 14 + v*6);
      g.addColorStop(0, `hsla(${s.hue},100%,70%,${0.3 + v*0.3})`);
      g.addColorStop(1, `hsla(${s.hue},100%,50%,0)`);
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(p.x, p.y, 14 + v*6, 0, 6.28); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
      ctx.fillStyle = `hsla(${s.hue},90%,80%,0.8)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, 3.5 + v*2, 0, 6.28); ctx.fill();
      ctx.restore();
    }
  }

  // ── Sparks ───────────────────────────────────────────
  sparks = sparks.filter(p => p.life > 0);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const p of sparks) {
    p.x += p.vx; p.y += p.vy; p.vy += 0.25; p.life -= 0.028;
    ctx.strokeStyle = `hsla(${p.hue},100%,85%,${p.life})`;
    ctx.lineWidth = 1.5 * p.life;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x-p.vx*2, p.y-p.vy*2); ctx.stroke();
  }
  ctx.restore();

  // ── Hands + pinch preview ────────────────────────────
  for (const st of Object.values(handState)) {
    const l = st.l;
    if (!l) continue;

    // Skeleton
    ctx.strokeStyle = st.pin ? 'rgba(255,200,100,0.5)' : 'rgba(50,255,100,0.5)';
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (const [a, b] of CONN) {
      ctx.beginPath();
      ctx.moveTo(l[a].x*W, l[a].y*H); ctx.lineTo(l[b].x*W, l[b].y*H);
      ctx.stroke();
    }

    // Joints
    for (let j = 0; j < l.length; j++) {
      const isTip = j===4||j===8||j===12||j===16||j===20;
      ctx.fillStyle = isTip ? 'rgba(255,100,160,0.8)' : 'rgba(80,230,160,0.6)';
      ctx.beginPath(); ctx.arc(l[j].x*W, l[j].y*H, isTip?4:2.5, 0, 6.28); ctx.fill();
    }

    // Pinch preview line
    if (st.pin && st.start && st.cur) {
      ctx.save();
      ctx.setLineDash([8, 8]);
      ctx.strokeStyle = '#fff';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(st.start.x, st.start.y);
      ctx.lineTo(st.cur.x, st.cur.y);
      ctx.stroke();
      ctx.restore();
    }
  }

  // ── Two-hand preview: line between both pinching hands ──
  const pinchHands = Object.values(handState).filter(s => s.pin && s.cur);
  if (pinchHands.length >= 2) {
    const a = pinchHands[0].cur, b = pinchHands[1].cur;
    ctx.save();
    ctx.setLineDash([6, 6]);
    ctx.strokeStyle = 'rgba(255,255,100,0.5)';
    ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    // Show note preview
    const L = dist(a, b);
    const m = mid(a, b);
    ctx.setLineDash([]);
    ctx.font = '12px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,100,0.5)';
    ctx.fillText(midiName(noteFor(L)), m.x, m.y - 10);
    ctx.restore();
  }

  // ── Grab indicator ───────────────────────────────────
  if (grab && strings[grab.idx]) {
    const p = strings[grab.idx][grab.ep];
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(p.x, p.y, 14, 0, 6.28); ctx.stroke();
    ctx.restore();
  }
}


// ══════════════════════════════════════════════════════════
//  FRAME LOOP — entirely wrapped in try-catch
// ══════════════════════════════════════════════════════════

function frame() {
  try {
    if (video.readyState >= 2 && video.currentTime !== lastT) {
      lastT = video.currentTime;
      handle(hl.detectForVideo(video, performance.now()).landmarks);
    }
    draw();
  } catch (e) {
    console.warn('Frame error (skipped):', e);
  }
  requestAnimationFrame(frame);
}


// ══════════════════════════════════════════════════════════
//  KEYBOARD
// ══════════════════════════════════════════════════════════

addEventListener('keydown', e => {
  if (e.key === 'c' || e.key === 'C') { strings = []; sparks = []; }
  if (e.key === 'z' || e.key === 'Z') strings.pop();
});


// ══════════════════════════════════════════════════════════
//  START
// ══════════════════════════════════════════════════════════

$('go').onclick = async () => {
  $('go').textContent = 'Loading...';
  try {
    ac = new AudioContext();
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { width: 1280, height: 720 }
    });
    await video.play();
    W = cv.width = video.videoWidth;
    H = cv.height = video.videoHeight;
    const fs = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    hl = await HandLandmarker.createFromOptions(fs, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        delegate: 'GPU'
      },
      runningMode: 'VIDEO',
      numHands: 2
    });
    $('go').remove();
    frame();
  } catch (err) {
    $('go').textContent = 'Error: ' + err.message;
    console.error(err);
  }
};
</script>
</body></html>
