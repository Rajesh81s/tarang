<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tarang — Air Harp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Draw strings in the air with two hands. Pluck them to make music. Real-time computer vision + Karplus-Strong synthesis.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🎵</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; color: #ccc; font: 13px/1.5 monospace; overflow: hidden; }
    #stage { position: relative; width: 100vw; height: 100vh; }
    video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
    video { opacity: 0.4; }
    #info {
      position: fixed; left: 10px; top: 8px; z-index: 5;
      font-size: 11px; line-height: 1.7; color: #777;
      text-shadow: 0 0 6px #000, 0 0 12px #000; pointer-events: none;
    }
    #note {
      position: fixed; right: 14px; top: 10px; z-index: 5;
      font-size: 32px; font-weight: bold; color: #7cf;
      text-shadow: 0 0 16px rgba(100,200,255,0.5);
      opacity: 0; transition: opacity 0.12s; pointer-events: none;
    }
    #note.show { opacity: 1; }
    #go {
      position: fixed; inset: 0; margin: auto; width: 220px; height: 50px; z-index: 10;
      font: bold 16px monospace; border-radius: 8px; border: 1px solid #555;
      background: #111; color: #ccc; cursor: pointer;
    }
    #go:hover { background: #222; border-color: #888; }
    #status { position: fixed; bottom: 50%; left: 50%; transform: translate(-50%, 60px); z-index: 10; font-size: 12px; color: #666; }
  </style>
</head>
<body>

<div id="stage">
  <video id="v" playsinline muted></video>
  <canvas id="c"></canvas>
</div>

<div id="info">
  Two hands pinch → draw string between them<br>
  Swipe finger across string → pluck<br>
  Grab endpoint → resize &nbsp;|&nbsp; Z undo &nbsp;|&nbsp; C clear
</div>

<div id="note"></div>
<button id="go">Start</button>
<div id="status"></div>

<script type="module">
/*
 * Tarang — Air Harp  (v3 — performance-safe)
 *
 * Glow technique: multiple overlapping strokes at different widths/opacities.
 * NO canvas shadowBlur (it forces per-stroke Gaussian blur → kills GPU).
 * NO separate glow canvas.
 * All glow is faked with thick transparent strokes + 'lighter' compositing.
 */

import {
  HandLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ── DOM ──────────────────────────────────────────────────────
const video   = document.getElementById('v');
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const noteEl  = document.getElementById('note');
const statusEl = document.getElementById('status');

// ── Constants ────────────────────────────────────────────────
const PENT = [0, 2, 4, 7, 9];
const PLUCK_COOLDOWN = 160;
const GRAB_RADIUS = 55;
const MAX_ACTIVE_SOURCES = 10;
const SMOOTHING = 0.32;
const MIN_STRING_LEN = 60;
const MARGIN = 15;

const CONN = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],[0,17]
];

// ── State ────────────────────────────────────────────────────
let W = 1280, H = 720;
let hl = null, ac = null, lastT = -1;
let strings = [];
let sparks = [];
let ripples = [];
let smoothed = {};
let prevTips = {};
let noteTimer = null;
let drawing = false;
let drawA = null, drawB = null;
let grabbing = null;
let activeSources = 0;
let lastHands = [];

// ── Utilities ────────────────────────────────────────────────
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mid  = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

function midiName(m) {
  const n = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  return n[m % 12] + (Math.floor(m / 12) - 1);
}

function clampPt(p) {
  return { x: clamp(p.x, MARGIN, W - MARGIN), y: clamp(p.y, MARGIN, H - MARGIN) };
}

function noteFor(length) {
  const ref = W * 0.8;
  let semis = clamp(12 * Math.log2(ref / Math.max(length, 10)), 0, 36);
  const oct = Math.floor(semis / 12), rem = semis - oct * 12;
  let best = PENT[0], bestD = Math.abs(rem - best);
  for (const iv of PENT) { const d = Math.abs(rem - iv); if (d < bestD) { best = iv; bestD = d; } }
  if (Math.abs(rem - 12) < bestD) best = 12;
  return 48 + oct * 12 + (best >= 12 ? 12 : best);
}

function segHit(p1, p2, p3, p4) {
  const dx1 = p2.x - p1.x, dy1 = p2.y - p1.y;
  const dx2 = p4.x - p3.x, dy2 = p4.y - p3.y;
  const d = dx1 * dy2 - dy1 * dx2;
  if (Math.abs(d) < 1e-10) return null;
  const t = ((p3.x - p1.x) * dy2 - (p3.y - p1.y) * dx2) / d;
  const u = ((p3.x - p1.x) * dy1 - (p3.y - p1.y) * dx1) / d;
  if (t >= 0 && t <= 1 && u >= 0 && u <= 1)
    return { x: p1.x + t * dx1, y: p1.y + t * dy1 };
  return null;
}


// ═══════════════════════════════════════════════════════════════
//  AUDIO — Karplus-Strong + Delay Echo
// ═══════════════════════════════════════════════════════════════

const noteCache = {};
let delayNode, delayGain, masterGain;

function initAudio() {
  ac = new AudioContext();
  masterGain = ac.createGain();
  masterGain.gain.value = 0.85;
  masterGain.connect(ac.destination);

  delayNode = ac.createDelay(1.0);
  delayNode.delayTime.value = 0.22;
  delayGain = ac.createGain();
  delayGain.gain.value = 0.25;
  const fb = ac.createGain();
  fb.gain.value = 0.3;

  delayNode.connect(delayGain);
  delayGain.connect(masterGain);
  delayNode.connect(fb);
  fb.connect(delayNode);
}

function ksBuffer(midi) {
  if (noteCache[midi]) return noteCache[midi];
  const sr = ac.sampleRate;
  const freq = 440 * Math.pow(2, (midi - 69) / 12);
  const N = Math.max(2, Math.round(sr / freq));
  const len = sr * 2.5;
  const buf = ac.createBuffer(1, len, sr);
  const data = buf.getChannelData(0);
  const ring = new Float32Array(N);
  for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
  for (let pass = 0; pass < 2; pass++)
    for (let i = 1; i < N; i++) ring[i] = 0.5 * ring[i] + 0.5 * ring[i - 1];
  let ptr = 0;
  for (let i = 0; i < len; i++) {
    const next = (ptr + 1) % N;
    data[i] = ring[ptr];
    ring[ptr] = (ring[ptr] + ring[next]) * 0.4982;
    ptr = next;
  }
  noteCache[midi] = buf;
  return buf;
}

function playNote(midi, vel) {
  if (!ac || ac.state === 'closed' || activeSources >= MAX_ACTIVE_SOURCES) return;
  const now = ac.currentTime;
  const src = ac.createBufferSource();
  const gain = ac.createGain();
  const filter = ac.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.value = 1800 + vel * 6000;
  filter.Q.value = 0.8;
  src.buffer = ksBuffer(midi);
  gain.gain.setValueAtTime(0.15 + vel * 0.5, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 2.2);
  src.connect(filter).connect(gain);
  gain.connect(masterGain);
  gain.connect(delayNode);
  activeSources++;
  src.onended = () => {
    activeSources--;
    try { src.disconnect(); filter.disconnect(); gain.disconnect(); } catch (_) {}
  };
  src.start();
  src.stop(now + 2.2);
}

function showNote(name, hue) {
  noteEl.textContent = name;
  noteEl.style.color = `hsl(${hue},90%,78%)`;
  noteEl.classList.add('show');
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => noteEl.classList.remove('show'), 1000);
}


// ═══════════════════════════════════════════════════════════════
//  STRING MANAGEMENT
// ═══════════════════════════════════════════════════════════════

function addString(a, b) {
  a = clampPt(a); b = clampPt(b);
  const L = dist(a, b);
  if (L < MIN_STRING_LEN) return null;
  const midi = noteFor(L);
  const hue = ((midi - 48) * 28) % 360;
  const s = {
    a: { ...a }, b: { ...b }, L, midi, hue, vib: 0, lastPluck: 0,
    thickness: clamp(1.5 + (36 - (midi - 48)) * 0.07, 1, 3),
    phase: Math.random() * Math.PI * 2,
  };
  strings.push(s);
  return s;
}

function updateStr(s) {
  s.a = clampPt(s.a); s.b = clampPt(s.b);
  s.L = dist(s.a, s.b);
  s.midi = noteFor(s.L);
  s.hue = ((s.midi - 48) * 28) % 360;
  s.thickness = clamp(1.5 + (36 - (s.midi - 48)) * 0.07, 1, 3);
}

function emitSparks(pt, count, hue) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2, sp = 1.5 + Math.random() * 8;
    sparks.push({ x: pt.x, y: pt.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 3,
      life: 1, hue, size: 0.8 + Math.random() * 2 });
  }
}

function emitRipple(pt, hue) {
  ripples.push({ x: pt.x, y: pt.y, r: 5, maxR: 50 + Math.random() * 25, life: 1, hue });
}


// ═══════════════════════════════════════════════════════════════
//  LANDMARK SMOOTHING
// ═══════════════════════════════════════════════════════════════

function smooth(raw, idx) {
  const prev = smoothed[idx];
  if (!prev || prev.length !== raw.length) {
    smoothed[idx] = raw.map(p => ({ x: p.x, y: p.y, z: p.z }));
    return smoothed[idx];
  }
  for (let j = 0; j < raw.length; j++) {
    prev[j].x = prev[j].x * SMOOTHING + raw[j].x * (1 - SMOOTHING);
    prev[j].y = prev[j].y * SMOOTHING + raw[j].y * (1 - SMOOTHING);
    prev[j].z = prev[j].z * SMOOTHING + raw[j].z * (1 - SMOOTHING);
  }
  return prev;
}


// ═══════════════════════════════════════════════════════════════
//  GESTURE PROCESSING
// ═══════════════════════════════════════════════════════════════

function pinchInfo(lm) {
  const thumb = { x: lm[4].x * W, y: lm[4].y * H };
  const index = { x: lm[8].x * W, y: lm[8].y * H };
  const wrist = { x: lm[0].x * W, y: lm[0].y * H };
  const mcp   = { x: lm[5].x * W, y: lm[5].y * H };
  const ps = dist(wrist, mcp);
  return { pinching: dist(thumb, index) < ps * 0.35, mid: mid(thumb, index) };
}

function processHands(allLm) {
  const now = performance.now();
  for (const k of Object.keys(smoothed)) if (+k >= allLm.length) delete smoothed[k];

  const hands = allLm.map((raw, i) => {
    const lm = smooth(raw, i);
    return { lm, ...pinchInfo(lm) };
  });

  // ── TWO-HAND DRAWING ──────────────────────────────────
  if (hands.length >= 2) {
    const h0 = hands[0], h1 = hands[1];
    if (h0.pinching && h1.pinching) {
      drawA = clampPt(h0.mid); drawB = clampPt(h1.mid);
      if (!drawing && !grabbing) {
        let found = false;
        for (let si = 0; si < strings.length; si++) {
          const s = strings[si];
          for (const [pt, hi] of [[h0.mid, 0], [h1.mid, 1]]) {
            if (dist(pt, s.a) < GRAB_RADIUS) { grabbing = { si, ep: 'a', h: hi }; found = true; break; }
            if (dist(pt, s.b) < GRAB_RADIUS) { grabbing = { si, ep: 'b', h: hi }; found = true; break; }
          }
          if (found) break;
        }
        if (!found) drawing = true;
      }
      if (grabbing) {
        const s = strings[grabbing.si];
        if (s) { s[grabbing.ep] = clampPt(grabbing.h === 0 ? h0.mid : h1.mid); updateStr(s); }
      }
    } else {
      if (drawing && drawA && drawB && dist(drawA, drawB) >= MIN_STRING_LEN) {
        const s = addString(drawA, drawB);
        if (s) playNote(s.midi, 0.1);
      }
      drawing = false; drawA = drawB = null; grabbing = null;
    }
  } else {
    if (drawing && drawA && drawB && dist(drawA, drawB) >= MIN_STRING_LEN) addString(drawA, drawB);
    drawing = false; drawA = drawB = null; grabbing = null;
  }

  // ── PLUCK ─────────────────────────────────────────────
  for (let i = 0; i < hands.length; i++) {
    const h = hands[i];
    if (h.pinching) { prevTips[i] = null; continue; }
    const lm = h.lm;
    const tips = [{ x: lm[8].x * W, y: lm[8].y * H }, { x: lm[12].x * W, y: lm[12].y * H }];
    const prev = prevTips[i];
    if (prev) {
      for (let k = 0; k < tips.length; k++) {
        if (!prev[k]) continue;
        for (const s of strings) {
          if (now - s.lastPluck < PLUCK_COOLDOWN) continue;
          const hit = segHit(prev[k], tips[k], s.a, s.b);
          if (hit) {
            const vel = clamp(dist(prev[k], tips[k]) / 35, 0.2, 1.0);
            s.lastPluck = now; s.vib = vel;
            playNote(s.midi, vel);
            emitSparks(hit, Math.round(12 + vel * 30), s.hue);
            emitRipple(hit, s.hue);
            showNote(midiName(s.midi), s.hue);
          }
        }
      }
    }
    prevTips[i] = tips;
  }
  for (const k of Object.keys(prevTips)) if (+k >= hands.length) delete prevTips[k];
  return hands;
}


// ═══════════════════════════════════════════════════════════════
//  RENDERING — Performance-safe glow (NO shadowBlur)
//
//  Glow trick: draw the same path 3 times at increasing
//  widths and decreasing opacities using 'lighter' blend.
//  This looks like bloom but costs almost nothing.
// ═══════════════════════════════════════════════════════════════

function draw(hands) {
  const now = performance.now();
  ctx.clearRect(0, 0, W, H);

  // ── Strings ─────────────────────────────────────────────
  for (const s of strings) {
    s.vib *= 0.935;
    if (s.vib < 0.004) s.vib = 0;

    const dx = s.b.x - s.a.x, dy = s.b.y - s.a.y;
    const L = s.L || 1;
    const nx = -dy / L, ny = dx / L;
    const v = s.vib;
    const segs = 36;

    // Idle gentle sway
    const idleAmp = 2;

    // Build path points once, reuse for all layers
    const pts = [];
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const vibOff = Math.sin(Math.PI * t) * v * 28 * Math.sin(now * 0.055 + t * 9);
      const idleOff = Math.sin(Math.PI * t) * idleAmp * Math.sin(now * 0.001 + s.phase + t * 2);
      pts.push({
        x: s.a.x + dx * t + nx * (vibOff + idleOff),
        y: s.a.y + dy * t + ny * (vibOff + idleOff),
      });
    }

    function strokePath(color, width) {
      ctx.strokeStyle = color;
      ctx.lineWidth = width;
      ctx.beginPath();
      for (let i = 0; i < pts.length; i++)
        i ? ctx.lineTo(pts[i].x, pts[i].y) : ctx.moveTo(pts[i].x, pts[i].y);
      ctx.stroke();
    }

    ctx.save();
    ctx.lineCap = 'round';

    // Layer 1: Wide outer glow (thick + transparent + lighter blend)
    ctx.globalCompositeOperation = 'lighter';
    strokePath(`hsla(${s.hue},100%,50%,${0.04 + v * 0.08})`, 14 + v * 10 + s.thickness * 2);

    // Layer 2: Medium glow
    strokePath(`hsla(${s.hue},100%,55%,${0.1 + v * 0.2})`, 5 + v * 5 + s.thickness);

    // Layer 3: Bright core
    ctx.globalCompositeOperation = 'source-over';
    strokePath(`hsl(${s.hue},100%,${74 + v * 20}%)`, s.thickness + v * 2.5);

    // Layer 4: White-hot center when vibrating
    if (v > 0.1) {
      ctx.globalCompositeOperation = 'lighter';
      strokePath(`rgba(255,255,255,${v * 0.3})`, 0.8 + v * 1.2);
    }

    ctx.restore();

    // ── Endpoints ──────────────────────────────────────────
    const pulse = 0.4 + 0.3 * Math.sin(now * 0.003 + s.phase);
    for (const p of [s.a, s.b]) {
      // Outer glow circle (no shadowBlur — just a transparent fill)
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 16 + v * 8);
      grad.addColorStop(0, `hsla(${s.hue},100%,70%,${0.25 + pulse * 0.15 + v * 0.25})`);
      grad.addColorStop(1, `hsla(${s.hue},100%,50%,0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 16 + v * 8, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // Core dot
      ctx.save();
      ctx.fillStyle = `hsla(${s.hue},90%,80%,${0.7 + pulse * 0.3})`;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 3.5 + v * 2.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();
    }
  }

  // ── Ripples ────────────────────────────────────────────
  ripples = ripples.filter(r => r.life > 0);
  for (const r of ripples) {
    r.r += (r.maxR - r.r) * 0.08;
    r.life -= 0.025;
    ctx.save();
    ctx.strokeStyle = `hsla(${r.hue},100%,70%,${r.life * 0.35})`;
    ctx.lineWidth = 1.5 * r.life;
    ctx.beginPath();
    ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // ── Sparks ─────────────────────────────────────────────
  sparks = sparks.filter(p => p.life > 0);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  for (const p of sparks) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.22; p.vx *= 0.985; p.life -= 0.022;

    // Trail
    ctx.strokeStyle = `hsla(${p.hue},100%,85%,${p.life * 0.85})`;
    ctx.lineWidth = p.size * p.life;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2);
    ctx.stroke();

    // Head dot
    ctx.fillStyle = `hsla(${p.hue},100%,95%,${p.life})`;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life * 0.7, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.restore();

  // ── Drawing preview ────────────────────────────────────
  if (drawing && drawA && drawB) {
    const L = dist(drawA, drawB);
    const m = mid(drawA, drawB);
    const midi = noteFor(L);
    ctx.save();
    ctx.setLineDash([10, 7]);
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(drawA.x, drawA.y);
    ctx.lineTo(drawB.x, drawB.y);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.font = '11px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.3)';
    ctx.fillText(`${midiName(midi)}  ${Math.round(L)}px`, m.x, m.y - 12);
    ctx.restore();
  }

  // ── Grab indicator ─────────────────────────────────────
  if (grabbing && strings[grabbing.si]) {
    const p = strings[grabbing.si][grabbing.ep];
    ctx.save();
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 15, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // ── Hand skeletons ─────────────────────────────────────
  for (const h of hands) {
    const lm = h.lm;
    const bc = h.pinching ? 'rgba(255,200,100,0.45)' : 'rgba(80,230,160,0.4)';
    const tc = h.pinching ? 'rgba(255,140,60,0.85)' : 'rgba(255,100,180,0.7)';
    const jc = h.pinching ? 'rgba(255,180,80,0.7)' : 'rgba(80,230,160,0.6)';

    ctx.save();
    ctx.strokeStyle = bc;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';
    for (const [a, b] of CONN) {
      ctx.beginPath();
      ctx.moveTo(lm[a].x * W, lm[a].y * H);
      ctx.lineTo(lm[b].x * W, lm[b].y * H);
      ctx.stroke();
    }
    for (let j = 0; j < lm.length; j++) {
      const isTip = j === 4 || j === 8 || j === 12 || j === 16 || j === 20;
      ctx.fillStyle = isTip ? tc : jc;
      ctx.beginPath();
      ctx.arc(lm[j].x * W, lm[j].y * H, isTip ? 4 : 2.5, 0, Math.PI * 2);
      ctx.fill();
    }

    // Pinch glow indicator
    if (h.pinching) {
      const m = mid({ x: lm[4].x * W, y: lm[4].y * H }, { x: lm[8].x * W, y: lm[8].y * H });
      ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createRadialGradient(m.x, m.y, 0, m.x, m.y, 15);
      g.addColorStop(0, 'rgba(255,220,100,0.3)');
      g.addColorStop(1, 'rgba(255,220,100,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(m.x, m.y, 15, 0, Math.PI * 2);
      ctx.fill();
    }
    ctx.restore();
  }
}


// ═══════════════════════════════════════════════════════════════
//  MAIN LOOP — with error protection
// ═══════════════════════════════════════════════════════════════

function frame() {
  try {
    if (video.readyState >= 2 && video.currentTime !== lastT) {
      lastT = video.currentTime;
      const result = hl.detectForVideo(video, performance.now());
      lastHands = processHands(result.landmarks);
    }
  } catch (e) {
    // If MediaPipe throws, don't kill the loop — just skip this frame
    console.warn('Detection frame skipped:', e.message);
  }
  draw(lastHands);
  requestAnimationFrame(frame);
}


// ═══════════════════════════════════════════════════════════════
//  KEYBOARD
// ═══════════════════════════════════════════════════════════════

addEventListener('keydown', e => {
  if (e.key === 'c' || e.key === 'C') { strings = []; sparks = []; ripples = []; }
  if (e.key === 'z' || e.key === 'Z') strings.pop();
});


// ═══════════════════════════════════════════════════════════════
//  STARTUP
// ═══════════════════════════════════════════════════════════════

document.getElementById('go').onclick = async () => {
  const btn = document.getElementById('go');
  btn.disabled = true; btn.textContent = 'Loading...';
  try {
    statusEl.textContent = 'Requesting camera...';
    initAudio();
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }
    });
    await video.play();
    W = canvas.width  = video.videoWidth  || 1280;
    H = canvas.height = video.videoHeight || 720;

    statusEl.textContent = 'Loading hand model...';
    const fs = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    hl = await HandLandmarker.createFromOptions(fs, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        delegate: 'GPU',
      },
      runningMode: 'VIDEO',
      numHands: 2,
    });
    btn.remove(); statusEl.remove();
    frame();
  } catch (err) {
    btn.disabled = false; btn.textContent = 'Start';
    statusEl.textContent = 'Error: ' + err.message;
    console.error(err);
  }
};
</script>
