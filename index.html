<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Tarang — Air Harp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Draw strings in the air with two hands. Pluck them to make music. Real-time computer vision + Karplus-Strong synthesis.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🎵</text></svg>">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; background: #000; color: #ccc; font: 13px/1.5 monospace; overflow: hidden; }
    #stage { position: relative; width: 100vw; height: 100vh; }
    video, canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; transform: scaleX(-1); }
    video { opacity: 0.5; }
    #info {
      position: fixed; left: 10px; top: 8px; z-index: 5;
      font-size: 12px; line-height: 1.7; color: #aaa;
      text-shadow: 0 0 4px #000; pointer-events: none;
    }
    #note {
      position: fixed; right: 14px; top: 10px; z-index: 5;
      font-size: 28px; font-weight: bold; color: #7cf;
      text-shadow: 0 0 12px rgba(100,200,255,0.4);
      opacity: 0; transition: opacity 0.15s; pointer-events: none;
    }
    #note.show { opacity: 1; }
    #go {
      position: fixed; inset: 0; margin: auto; width: 220px; height: 50px; z-index: 10;
      font: bold 16px monospace; border-radius: 8px; border: 1px solid #555;
      background: #111; color: #ccc; cursor: pointer;
    }
    #go:hover { background: #222; border-color: #888; }
    #status { position: fixed; bottom: 50%; left: 50%; transform: translate(-50%, 60px); z-index: 10; font-size: 12px; color: #666; }
  </style>
</head>
<body>

<div id="stage">
  <video id="v" playsinline muted></video>
  <canvas id="c"></canvas>
</div>

<div id="info">
  Two hands pinch → draw string between them<br>
  Swipe finger across string → pluck<br>
  Grab endpoint → resize &nbsp;|&nbsp; Z undo &nbsp;|&nbsp; C clear
</div>

<div id="note"></div>
<button id="go">Start</button>
<div id="status"></div>

<script type="module">
/*
 * Tarang — Air Harp
 * Open-source real-time gesture-controlled string instrument.
 *
 * String drawing: two-hand pinch (left hand = point A, right hand = point B).
 * Plucking: open-hand fingertip swipe across a string.
 * Resizing: pinch near a string endpoint and drag to move it.
 *
 * Audio: Karplus-Strong plucked-string synthesis via Web Audio API.
 * Vision: MediaPipe Hands (2 hands, GPU).
 */

import {
  HandLandmarker,
  FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs";

// ── DOM ──────────────────────────────────────────────────────
const video   = document.getElementById('v');
const canvas  = document.getElementById('c');
const ctx     = canvas.getContext('2d');
const noteEl  = document.getElementById('note');
const statusEl = document.getElementById('status');

// ── Constants ────────────────────────────────────────────────
const PENT = [0, 2, 4, 7, 9];           // C-major pentatonic intervals
const PLUCK_COOLDOWN = 150;              // ms per string
const GRAB_RADIUS = 50;                  // px — how close to grab an endpoint
const MAX_ACTIVE_SOURCES = 8;            // cap concurrent audio nodes to prevent freeze
const SMOOTHING = 0.3;                   // landmark smoothing factor

// MediaPipe hand skeleton connections
const CONN = [
  [0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],
  [5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],
  [13,17],[17,18],[18,19],[19,20],[0,17]
];

// ── State ────────────────────────────────────────────────────
let W = 1280, H = 720;
let hl = null;                           // HandLandmarker
let ac = null;                           // AudioContext
let lastT = -1;
let strings = [];
let sparks = [];
let smoothed = {};                       // per-hand smoothed landmarks
let prevTips = {};                       // previous fingertip positions for pluck detection
let noteTimer = null;

// Two-hand drawing state
let drawing = false;                     // are both hands pinching to draw?
let drawA = null;                        // left-hand pinch midpoint
let drawB = null;                        // right-hand pinch midpoint

// Grab-to-resize state
let grabbing = null;                     // { stringIndex, endpoint: 'a'|'b' }

// Active audio source tracking to prevent freeze
let activeSources = 0;

// ── Utilities ────────────────────────────────────────────────
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const mid  = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
const clamp = (v, lo, hi) => v < lo ? lo : v > hi ? hi : v;

function midiName(m) {
  const names = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
  return names[m % 12] + (Math.floor(m / 12) - 1);
}

// ── Pitch mapping ────────────────────────────────────────────
// Longer string → lower note, snapped to pentatonic scale.
function noteFor(length) {
  const ref = W * 0.8;
  let semis = clamp(12 * Math.log2(ref / length), 0, 36);
  const oct = Math.floor(semis / 12);
  const rem = semis - oct * 12;
  // snap to nearest pentatonic degree
  let best = PENT[0], bestD = Math.abs(rem - best);
  for (const iv of PENT) {
    const d = Math.abs(rem - iv);
    if (d < bestD) { best = iv; bestD = d; }
  }
  if (Math.abs(rem - 12) < bestD) best = 12;
  return 48 + oct * 12 + (best >= 12 ? 12 : best);
}

// ── Segment intersection (for pluck detection) ───────────────
function segHit(p1, p2, p3, p4) {
  const dx1 = p2.x - p1.x, dy1 = p2.y - p1.y;
  const dx2 = p4.x - p3.x, dy2 = p4.y - p3.y;
  const d = dx1 * dy2 - dy1 * dx2;
  if (Math.abs(d) < 1e-10) return null;
  const t = ((p3.x - p1.x) * dy2 - (p3.y - p1.y) * dx2) / d;
  const u = ((p3.x - p1.x) * dy1 - (p3.y - p1.y) * dx1) / d;
  if (t >= 0 && t <= 1 && u >= 0 && u <= 1) {
    return { x: p1.x + t * dx1, y: p1.y + t * dy1 };
  }
  return null;
}


// ═══════════════════════════════════════════════════════════════
//  AUDIO ENGINE — Karplus-Strong with source limiting
// ═══════════════════════════════════════════════════════════════

const noteCache = {};

function ksBuffer(midi) {
  if (noteCache[midi]) return noteCache[midi];
  const sr = ac.sampleRate;
  const freq = 440 * Math.pow(2, (midi - 69) / 12);
  const N = Math.max(2, Math.round(sr / freq));
  const len = sr * 2;  // 2 seconds (shorter = less memory)
  const buf = ac.createBuffer(1, len, sr);
  const data = buf.getChannelData(0);

  // Delay line with filtered noise burst
  const ring = new Float32Array(N);
  for (let i = 0; i < N; i++) ring[i] = Math.random() * 2 - 1;
  // Warm the attack
  for (let i = 1; i < N; i++) ring[i] = 0.5 * ring[i] + 0.5 * ring[i - 1];

  let ptr = 0;
  for (let i = 0; i < len; i++) {
    const next = (ptr + 1) % N;
    data[i] = ring[ptr];
    ring[ptr] = (ring[ptr] + ring[next]) * 0.498;
    ptr = next;
  }
  noteCache[midi] = buf;
  return buf;
}

function playNote(midi, vel) {
  if (!ac || ac.state === 'closed') return;

  // ── CRITICAL: prevent audio node accumulation freeze ──
  if (activeSources >= MAX_ACTIVE_SOURCES) return;

  const now = ac.currentTime;
  const src = ac.createBufferSource();
  const gain = ac.createGain();

  src.buffer = ksBuffer(midi);
  const volume = 0.2 + vel * 0.45;
  gain.gain.setValueAtTime(volume, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 1.8);

  src.connect(gain).connect(ac.destination);

  activeSources++;
  src.onended = () => {
    activeSources--;
    // Disconnect to free resources immediately
    try { src.disconnect(); gain.disconnect(); } catch (_) {}
  };

  src.start();
  src.stop(now + 1.8);
}

function showNote(name, hue) {
  noteEl.textContent = name;
  noteEl.style.color = `hsl(${hue}, 90%, 75%)`;
  noteEl.classList.add('show');
  clearTimeout(noteTimer);
  noteTimer = setTimeout(() => noteEl.classList.remove('show'), 900);
}


// ═══════════════════════════════════════════════════════════════
//  STRING MANAGEMENT
// ═══════════════════════════════════════════════════════════════

function addString(a, b) {
  const L = dist(a, b);
  if (L < 40) return null;  // too short
  const midi = noteFor(L);
  const hue = ((midi - 48) * 25) % 360;
  const s = {
    a: { ...a }, b: { ...b },
    L, midi, hue,
    vib: 0,         // vibration amplitude
    lastPluck: 0,   // pluck cooldown timestamp
  };
  strings.push(s);
  return s;
}

function updateStringProps(s) {
  s.L = dist(s.a, s.b);
  s.midi = noteFor(s.L);
  s.hue = ((s.midi - 48) * 25) % 360;
}


// ═══════════════════════════════════════════════════════════════
//  LANDMARK SMOOTHING
// ═══════════════════════════════════════════════════════════════

function smoothLandmarks(raw, handIdx) {
  const prev = smoothed[handIdx];
  if (!prev || prev.length !== raw.length) {
    smoothed[handIdx] = raw.map(p => ({ x: p.x, y: p.y, z: p.z }));
    return smoothed[handIdx];
  }
  for (let j = 0; j < raw.length; j++) {
    prev[j].x = prev[j].x * SMOOTHING + raw[j].x * (1 - SMOOTHING);
    prev[j].y = prev[j].y * SMOOTHING + raw[j].y * (1 - SMOOTHING);
    prev[j].z = prev[j].z * SMOOTHING + raw[j].z * (1 - SMOOTHING);
  }
  return prev;
}


// ═══════════════════════════════════════════════════════════════
//  GESTURE PROCESSING
// ═══════════════════════════════════════════════════════════════

function isPinching(lm, W, H) {
  // Returns { pinching, mid } — whether thumb+index are pinched and their midpoint
  const thumb = { x: lm[4].x * W, y: lm[4].y * H };
  const index = { x: lm[8].x * W, y: lm[8].y * H };
  const wrist = { x: lm[0].x * W, y: lm[0].y * H };
  const mcp   = { x: lm[5].x * W, y: lm[5].y * H };
  const palmScale = dist(wrist, mcp);
  const pinchDist = dist(thumb, index);
  const threshold = palmScale * 0.38;
  return {
    pinching: pinchDist < threshold,
    mid: mid(thumb, index),
    palmScale,
  };
}

function processHands(allLandmarks) {
  const now = performance.now();

  // Clean up old smoothed data
  for (const k of Object.keys(smoothed)) {
    if (+k >= allLandmarks.length) delete smoothed[k];
  }

  // Smooth all hands
  const hands = allLandmarks.map((raw, i) => {
    const lm = smoothLandmarks(raw, i);
    const pinch = isPinching(lm, W, H);
    return { lm, ...pinch };
  });

  // ── TWO-HAND STRING DRAWING ────────────────────────────
  if (hands.length >= 2) {
    const h0 = hands[0], h1 = hands[1];

    if (h0.pinching && h1.pinching) {
      // Both hands pinching → drawing or resizing
      drawA = h0.mid;
      drawB = h1.mid;

      // Check if we should grab an existing endpoint instead of drawing new
      if (!drawing && grabbing === null) {
        // Look for a nearby endpoint to grab
        let foundGrab = false;
        for (let si = 0; si < strings.length; si++) {
          const s = strings[si];
          // Check if either pinch point is near an endpoint
          for (const [pinchPt, otherPt, handLabel] of [
            [h0.mid, h1.mid, 0], [h1.mid, h0.mid, 1]
          ]) {
            if (dist(pinchPt, s.a) < GRAB_RADIUS) {
              grabbing = { si, ep: 'a', hand: handLabel };
              foundGrab = true; break;
            }
            if (dist(pinchPt, s.b) < GRAB_RADIUS) {
              grabbing = { si, ep: 'b', hand: handLabel };
              foundGrab = true; break;
            }
          }
          if (foundGrab) break;
        }

        if (!foundGrab) {
          drawing = true;
        }
      }

      // If grabbing, update the grabbed endpoint
      if (grabbing) {
        const s = strings[grabbing.si];
        if (s) {
          const grabHand = grabbing.hand === 0 ? h0.mid : h1.mid;
          s[grabbing.ep] = { ...grabHand };
          updateStringProps(s);
        }
      }
    } else {
      // At least one hand released
      if (drawing && drawA && drawB) {
        const L = dist(drawA, drawB);
        if (L > 40) {
          const s = addString(drawA, drawB);
          if (s) playNote(s.midi, 0.12);  // soft creation sound
        }
      }
      drawing = false;
      drawA = null;
      drawB = null;
      grabbing = null;
    }
  } else {
    // Less than 2 hands visible
    if (drawing && drawA && drawB && dist(drawA, drawB) > 40) {
      addString(drawA, drawB);
    }
    drawing = false;
    drawA = null;
    drawB = null;
    grabbing = null;
  }

  // ── PLUCK DETECTION (open-hand finger swipe) ───────────
  for (let i = 0; i < hands.length; i++) {
    const h = hands[i];
    if (h.pinching) {
      prevTips[i] = null;
      continue;  // don't pluck while pinching
    }

    const lm = h.lm;
    const tips = [
      { x: lm[8].x * W, y: lm[8].y * H },   // index
      { x: lm[12].x * W, y: lm[12].y * H },  // middle
    ];

    const prev = prevTips[i];
    if (prev) {
      for (let k = 0; k < tips.length; k++) {
        if (!prev[k]) continue;
        for (const s of strings) {
          if (now - s.lastPluck < PLUCK_COOLDOWN) continue;
          const hit = segHit(prev[k], tips[k], s.a, s.b);
          if (hit) {
            const vel = clamp(dist(prev[k], tips[k]) / 40, 0.2, 1.0);
            s.lastPluck = now;
            s.vib = vel;
            playNote(s.midi, vel);
            spark(hit, Math.round(8 + vel * 25), s.hue);
            showNote(midiName(s.midi), s.hue);
          }
        }
      }
    }
    prevTips[i] = tips;
  }

  // Clean up stale tips
  for (const k of Object.keys(prevTips)) {
    if (+k >= hands.length) delete prevTips[k];
  }

  return hands;
}


// ═══════════════════════════════════════════════════════════════
//  SPARK PARTICLES
// ═══════════════════════════════════════════════════════════════

function spark(pt, count, hue) {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 7;
    sparks.push({
      x: pt.x, y: pt.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      life: 1, hue,
    });
  }
}


// ═══════════════════════════════════════════════════════════════
//  RENDERING
// ═══════════════════════════════════════════════════════════════

function draw(hands) {
  const now = performance.now();
  ctx.clearRect(0, 0, W, H);

  // ── Strings ─────────────────────────────────────────────
  for (const s of strings) {
    s.vib *= 0.94;
    if (s.vib < 0.005) s.vib = 0;

    const dx = s.b.x - s.a.x, dy = s.b.y - s.a.y;
    const L = s.L || 1;
    const nx = -dy / L, ny = dx / L;
    const v = s.vib;
    const segs = 40;

    // Glow pass
    ctx.save();
    ctx.globalCompositeOperation = 'lighter';
    ctx.strokeStyle = `hsla(${s.hue},100%,55%,${0.12 + v * 0.25})`;
    ctx.shadowColor = `hsl(${s.hue},100%,50%)`;
    ctx.shadowBlur = 6 + v * 30;
    ctx.lineWidth = 2.5 + v * 5;
    ctx.beginPath();
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const off = Math.sin(Math.PI * t) * v * 28 * Math.sin(now * 0.06 + t * 9);
      const x = s.a.x + dx * t + nx * off;
      const y = s.a.y + dy * t + ny * off;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    ctx.restore();

    // Core line
    ctx.save();
    ctx.strokeStyle = `hsl(${s.hue},100%,${72 + v * 20}%)`;
    ctx.shadowColor = `hsl(${s.hue},100%,60%)`;
    ctx.shadowBlur = 3 + v * 15;
    ctx.lineWidth = 1.5 + v * 2;
    ctx.beginPath();
    for (let i = 0; i <= segs; i++) {
      const t = i / segs;
      const off = Math.sin(Math.PI * t) * v * 28 * Math.sin(now * 0.06 + t * 9);
      const x = s.a.x + dx * t + nx * off;
      const y = s.a.y + dy * t + ny * off;
      i ? ctx.lineTo(x, y) : ctx.moveTo(x, y);
    }
    ctx.stroke();
    ctx.restore();

    // Endpoints — grabbable markers
    for (const p of [s.a, s.b]) {
      ctx.save();
      ctx.fillStyle = `hsla(${s.hue},80%,70%,0.6)`;
      ctx.shadowColor = `hsl(${s.hue},100%,55%)`;
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 6, 0, Math.PI * 2);
      ctx.fill();
      // Outer grab ring
      ctx.strokeStyle = `hsla(${s.hue},60%,60%,0.3)`;
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.arc(p.x, p.y, GRAB_RADIUS * 0.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }
  }

  // ── Drawing preview (dashed line between two pinching hands) ──
  if (drawing && drawA && drawB) {
    ctx.save();
    ctx.setLineDash([10, 7]);
    ctx.strokeStyle = 'rgba(255,255,255,0.45)';
    ctx.lineWidth = 2;
    ctx.shadowColor = 'rgba(255,255,255,0.15)';
    ctx.shadowBlur = 8;
    ctx.beginPath();
    ctx.moveTo(drawA.x, drawA.y);
    ctx.lineTo(drawB.x, drawB.y);
    ctx.stroke();
    // Length label
    const L = dist(drawA, drawB);
    const m = mid(drawA, drawB);
    ctx.setLineDash([]);
    ctx.font = '11px monospace';
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.fillText(`${Math.round(L)}px`, m.x, m.y - 10);
    ctx.restore();
  }

  // ── Grab indicator ──
  if (grabbing && strings[grabbing.si]) {
    const s = strings[grabbing.si];
    const p = s[grabbing.ep];
    ctx.save();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.arc(p.x, p.y, 14, 0, Math.PI * 2);
    ctx.stroke();
    ctx.restore();
  }

  // ── Sparks ──────────────────────────────────────────────
  sparks = sparks.filter(p => p.life > 0);
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (const p of sparks) {
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.28; p.life -= 0.028;
    ctx.strokeStyle = `hsla(${p.hue},100%,80%,${p.life})`;
    ctx.lineWidth = 1.5 * p.life;
    ctx.beginPath();
    ctx.moveTo(p.x, p.y);
    ctx.lineTo(p.x - p.vx * 1.8, p.y - p.vy * 1.8);
    ctx.stroke();
  }
  ctx.restore();

  // ── Hand skeletons ─────────────────────────────────────
  for (const h of hands) {
    const lm = h.lm;
    // Bones
    ctx.strokeStyle = 'rgba(80,230,160,0.5)';
    ctx.lineWidth = 2;
    for (const [a, b] of CONN) {
      ctx.beginPath();
      ctx.moveTo(lm[a].x * W, lm[a].y * H);
      ctx.lineTo(lm[b].x * W, lm[b].y * H);
      ctx.stroke();
    }
    // Joints
    for (let j = 0; j < lm.length; j++) {
      const isTip = j === 4 || j === 8 || j === 12 || j === 16 || j === 20;
      ctx.fillStyle = isTip ? 'rgba(255,100,180,0.8)' : 'rgba(80,230,160,0.7)';
      ctx.beginPath();
      ctx.arc(lm[j].x * W, lm[j].y * H, isTip ? 4.5 : 3, 0, Math.PI * 2);
      ctx.fill();
    }
  }
}


// ═══════════════════════════════════════════════════════════════
//  MAIN LOOP
// ═══════════════════════════════════════════════════════════════

function frame() {
  let hands = [];
  if (video.readyState >= 2 && video.currentTime !== lastT) {
    lastT = video.currentTime;
    const result = hl.detectForVideo(video, performance.now());
    hands = processHands(result.landmarks);
  }
  draw(hands.length ? hands : []);
  requestAnimationFrame(frame);
}


// ═══════════════════════════════════════════════════════════════
//  KEYBOARD
// ═══════════════════════════════════════════════════════════════

addEventListener('keydown', e => {
  if (e.key === 'c' || e.key === 'C') strings = [];
  if (e.key === 'z' || e.key === 'Z') strings.pop();
});


// ═══════════════════════════════════════════════════════════════
//  STARTUP
// ═══════════════════════════════════════════════════════════════

document.getElementById('go').onclick = async () => {
  const btn = document.getElementById('go');
  btn.disabled = true;
  btn.textContent = 'Loading...';

  try {
    statusEl.textContent = 'Requesting camera...';
    ac = new AudioContext();
    video.srcObject = await navigator.mediaDevices.getUserMedia({
      video: { width: { ideal: 1280 }, height: { ideal: 720 }, facingMode: 'user' }
    });
    await video.play();
    W = canvas.width  = video.videoWidth  || 1280;
    H = canvas.height = video.videoHeight || 720;

    statusEl.textContent = 'Loading hand model...';
    const fs = await FilesetResolver.forVisionTasks(
      'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm'
    );
    hl = await HandLandmarker.createFromOptions(fs, {
      baseOptions: {
        modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
        delegate: 'GPU',
      },
      runningMode: 'VIDEO',
      numHands: 2,
    });

    btn.remove();
    statusEl.remove();
    frame();
  } catch (err) {
    btn.disabled = false;
    btn.textContent = 'Start';
    statusEl.textContent = 'Error: ' + err.message;
    console.error(err);
  }
};
</script>
</body>
</html>
